# Local synthetic-data demo.
#   docker compose up -d --wait                       Kafka only; run the JAR on the host
#   docker compose --profile app up -d --build --wait  Kafka and DLQDesk in containers
services:
  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "127.0.0.1:59092:9092"
    mem_limit: 768m
    cpus: 2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:59092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller localhost:9093 describe --status >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 12

  dlqdesk:
    profiles: ["app"]
    build: .
    image: dlqdesk:local
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - dlqdesk-data:/app/data

volumes:
  dlqdesk-data:
