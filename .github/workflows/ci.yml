name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21', '25']
    env:
      MAVEN_OPTS: --enable-native-access=ALL-UNNAMED -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci
      - name: Check frontend types and formatting
        working-directory: ui
        run: npm run check
      - name: Test frontend behavior
        working-directory: ui
        run: npm test
      - name: Build frontend
        working-directory: ui
        run: npm run build
      - name: Verify Java and package the application
        shell: pwsh
        run: |
          if ($IsWindows) {
            & ./mvnw.cmd -B verify
          } else {
            if ("${{ matrix.java }}" -eq "21") { & ./mvnw -B verify -Pintegration } else { & ./mvnw -B verify }
          }
          exit $LASTEXITCODE
      - name: Install Chromium for packaged-app checks
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Start the isolated demo broker
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: docker compose up -d --wait
      - name: Test packaged application in desktop and mobile Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        working-directory: ui
        run: npm run test:browser
      - name: Stop demo broker
        if: always() && matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: docker compose down
      - name: Retain the tested release candidate
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          compression-level: 0
          if-no-files-found: error
          path: |
            target/dlqdesk-0.2.0.jar
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            ui/test-results/
          if-no-files-found: error
