server.address=127.0.0.1
server.port=8092
spring.application.name=dlqdesk
spring.datasource.url=jdbc:h2:file:./data/dlqdesk;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
dlqdesk.api-token=${DLQDESK_API_TOKEN:}
dlqdesk.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
dlqdesk.dlt-topic=${DLQDESK_DLT_TOPIC:orders.DLT}
dlqdesk.target-topic=${DLQDESK_TARGET_TOPIC:orders}
dlqdesk.demo=false
server.error.include-message=never
logging.level.org.apache.kafka=WARN
